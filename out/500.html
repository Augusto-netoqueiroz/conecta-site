<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Erro temporário | Contrate TV</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}.box{width:min(720px,100%);border-left:8px solid #ed0016;padding:24px 28px}.code{color:#ed0016;font-size:12px;font-weight:900;letter-spacing:.16em}.box h1{margin:12px 0;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-.05em}.box p{color:#66707c;line-height:1.6}.box a{display:inline-block;margin-top:14px;padding:14px 18px;background:#ed0016;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="box">
    <span class="code">ERRO 500</span>
    <h1>O site está temporariamente indisponível.</h1>
    <p>Aguarde alguns instantes e tente novamente.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
